<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campus Clubs Register</title>
<style>
:root {
  --bg: #F2F5F8; --surface: #FFFFFF; --ink: #17212B; --muted: #5B6877; --line: #D9E0E7;
  --brand: #0E6B63; --brand-dark: #0A524C; --brand-soft: #DDF0ED;
  --warn: #8A4B08; --warn-soft: #FDF0DC; --danger: #B3261E; --danger-soft: #FBE4E2;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.5 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; }
header { background: var(--brand); color: #fff; padding: 28px 20px; }
.wrap { max-width: 1180px; margin: 0 auto; }
header h1 { margin: 0; font-size: 1.75rem; font-weight: 700; letter-spacing: -0.01em; }
header p { margin: 4px 0 0; opacity: .9; }
main.wrap { padding: 24px 20px 48px; display: grid; gap: 24px;
  grid-template-columns: minmax(300px, 370px) 1fr; align-items: start; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 20px; }
.card h2 { margin: 0 0 14px; font-size: 1.15rem; }
#form-card { position: sticky; top: 16px; }
label { display: block; font-weight: 600; font-size: .9rem; margin: 12px 0 4px; }
input, select, textarea { width: 100%; padding: 9px 10px; font: inherit; color: inherit;
  border: 1px solid #B8C3CE; border-radius: 6px; background: #fff; }
textarea { resize: vertical; min-height: 72px; }
.row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
:focus-visible { outline: 3px solid #1F8FFF; outline-offset: 2px; }
.actions { display: flex; gap: 10px; margin-top: 18px; }
button { font: inherit; font-weight: 600; border-radius: 6px; padding: 9px 16px; cursor: pointer;
  border: 1px solid transparent; }
.primary { background: var(--brand); color: #fff; }
.primary:hover { background: var(--brand-dark); }
.secondary { background: #fff; color: var(--ink); border-color: #B8C3CE; }
.secondary:hover { background: var(--bg); }
.toolbar { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
.toolbar input { flex: 1 1 200px; width: auto; }
.toolbar select { flex: 0 1 190px; width: auto; }
.count { color: var(--muted); font-size: .9rem; margin-left: auto; }
.table-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; min-width: 640px; }
th { text-align: left; font-size: .85rem; color: var(--muted); font-weight: 600;
  border-bottom: 2px solid var(--line); padding: 8px 10px; }
td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.editing td { background: var(--warn-soft); }
.club-name { font-weight: 700; }
.chip { display: inline-block; background: var(--brand-soft); color: var(--brand-dark);
  border-radius: 999px; padding: 1px 10px; font-size: .78rem; font-weight: 600; margin-left: 6px; }
.desc { color: var(--muted); font-size: .88rem; margin-top: 2px; max-width: 46ch;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.small { color: var(--muted); font-size: .85rem; }
.num { text-align: right; }
.row-actions { display: flex; gap: 6px; white-space: nowrap; }
.row-actions button { padding: 4px 10px; font-size: .85rem; }
.edit { background: var(--warn-soft); color: var(--warn); border-color: #E8C98F; }
.del { background: var(--danger-soft); color: var(--danger); border-color: #EFB4AF; }
.empty { text-align: center; color: var(--muted); padding: 32px 10px; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); max-width: 90vw;
  padding: 10px 18px; border-radius: 8px; color: #fff; font-weight: 600; background: var(--brand-dark);
  opacity: 0; pointer-events: none; transition: opacity .2s; }
#toast.show { opacity: 1; }
#toast.error { background: var(--danger); }
@media (max-width: 860px) {
  main.wrap { grid-template-columns: 1fr; }
  #form-card { position: static; }
}
@media (prefers-reduced-motion: reduce) { #toast { transition: none; } }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Campus Clubs Register</h1>
    <p>Add, update and remove the clubs on campus.</p>
  </div>
</header>

<main class="wrap">
  <section class="card" id="form-card" aria-labelledby="form-title">
    <h2 id="form-title">Add a club</h2>
    <form id="club-form" novalidate>
      <label for="name">Club name *</label>
      <input id="name" name="name" maxlength="120" required autocomplete="off">

      <div class="row">
        <div>
          <label for="category">Category</label>
          <select id="category" name="category"></select>
        </div>
        <div>
          <label for="meeting_day">Meeting day</label>
          <select id="meeting_day" name="meeting_day"></select>
        </div>
      </div>

      <label for="description">Description</label>
      <textarea id="description" name="description" maxlength="500"></textarea>

      <label for="venue">Venue</label>
      <input id="venue" name="venue" maxlength="120">

      <div class="row">
        <div>
          <label for="president_name">President</label>
          <input id="president_name" name="president_name" maxlength="120">
        </div>
        <div>
          <label for="member_count">Members</label>
          <input id="member_count" name="member_count" type="number" min="0" step="1" value="0">
        </div>
      </div>

      <label for="contact_email">Contact email</label>
      <input id="contact_email" name="contact_email" type="email" maxlength="120">

      <div class="actions">
        <button type="submit" class="primary" id="submit-btn">Add club</button>
        <button type="button" class="secondary" id="cancel-btn" hidden>Cancel edit</button>
      </div>
    </form>
  </section>

  <section class="card" aria-labelledby="list-title">
    <h2 id="list-title">Registered clubs</h2>
    <div class="toolbar">
      <input id="search" type="search" placeholder="Search by name, president or venue" aria-label="Search clubs">
      <select id="filter-category" aria-label="Filter by category"></select>
      <span class="count" id="count" aria-live="polite"></span>
    </div>
    <div class="table-scroll">
      <table>
        <thead>
          <tr><th>Club</th><th>Meets</th><th>President</th><th class="num">Members</th><th>Updated</th><th>Actions</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>
</main>

<div id="toast" role="status" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
